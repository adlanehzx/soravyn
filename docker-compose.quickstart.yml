services:
  soravyn:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SORAVYN_PORT:-3200}:3200"
    environment:
      HOST: "0.0.0.0"
      SORAVYN_HOME: "/soravyn"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      SORAVYN_DEPLOYMENT_MODE: "authenticated"
      SORAVYN_DEPLOYMENT_EXPOSURE: "private"
      SORAVYN_PUBLIC_URL: "${SORAVYN_PUBLIC_URL:-http://localhost:3200}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      - "${SORAVYN_DATA_DIR:-./data/docker-soravyn}:/soravyn"
